name: Docker Build and Publish

on:
  push:
    branches:
      - main   # Runs when you push to main branch

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        path: [front, backend, api]   # Each job runs once per path

    steps:
      # Step 1: Checkout your repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Log in to DockerHub using secrets
      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 4: Build and push Docker image for each matrix path
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.path }}
          file: ./${{ matrix.path }}/Dockerfile
          push: true
          tags: user/${{ matrix.path }}:latest
